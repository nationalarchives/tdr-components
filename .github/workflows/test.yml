name: Run all tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENCE'
      - 'README.md'

permissions: {}


jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: critical
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run code style and lint tests
        uses: ./.github/actions/lint

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests
        uses: ./.github/actions/tests

  storybook-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run interaction and accessibility test
        uses: ./.github/actions/storybook-tests
